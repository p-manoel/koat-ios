{
  "steps": [
    {
      "run": "store-coach-start.yaml"
    },
    {
      "echo": "Busca de alunos — posição conferida na árvore de acessibilidade do iPhone 17 Pro Max."
    },
    {
      "tool": "gesture-tap",
      "args": {
        "x": 0.4,
        "y": 0.19
      }
    },
    {
      "tool": "keyboard",
      "args": {
        "text": "Mariana",
        "delayMs": 1
      }
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "visible",
        "selector": {
          "text": "Mariana Oliveira"
        },
        "timeoutMs": 15000
      }
    },
    {
      "echo": "Resultado Mariana Oliveira — posição conferida na árvore de acessibilidade do iPhone 17 Pro Max."
    },
    {
      "tool": "gesture-tap",
      "args": {
        "x": 0.32,
        "y": 0.325
      }
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "visible",
        "selector": {
          "text": "Força e equilíbrio"
        },
        "timeoutMs": 15000
      }
    },
    {
      "wait": 600
    },
    {
      "await": {
        "idle": true
      }
    }
  ]
}

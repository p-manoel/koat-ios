{
  "steps": [
    {
      "launch": "Koat.Koat"
    },
    {
      "echo": "Fechar a permissão de notificações após a reinstalação limpa; botão conferido pelo Argent."
    },
    {
      "tool": "gesture-tap",
      "args": {
        "x": 0.33,
        "y": 0.585
      }
    },
    {
      "wait": 600
    },
    {
      "launch": "Koat.Koat"
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "visible",
        "selector": {
          "text": "Digite seu email"
        },
        "timeoutMs": 15000
      }
    },
    {
      "echo": "Campo de email — posição conferida na árvore de acessibilidade do iPhone 17 Pro Max."
    },
    {
      "tool": "gesture-tap",
      "args": {
        "x": 0.4,
        "y": 0.5
      }
    },
    {
      "wait": 600
    },
    {
      "tool": "keyboard",
      "args": {
        "text": "appstore.coach@example.com",
        "delayMs": 1
      }
    },
    {
      "tool": "keyboard",
      "args": {
        "key": "tab"
      }
    },
    {
      "wait": 600
    },
    {
      "tool": "keyboard",
      "args": {
        "text": "{{secret:DEMO_PASSWORD}}",
        "delayMs": 1
      }
    },
    {
      "tool": "keyboard",
      "args": {
        "key": "enter"
      }
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "visible",
        "selector": {
          "text": "Ver todos os alunos"
        },
        "timeoutMs": 15000
      }
    }
  ]
}

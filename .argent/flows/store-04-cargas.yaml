{
  "steps": [
    {
      "run": "store-03-analise.yaml"
    },
    {
      "echo": "Agachamento com barra — posição conferida na árvore de acessibilidade do iPhone 17 Pro Max."
    },
    {
      "tool": "gesture-tap",
      "args": {
        "x": 0.26,
        "y": 0.36
      }
    },
    {
      "tool": "await-ui-element",
      "args": {
        "condition": "visible",
        "selector": {
          "text": "Progressão por sessão"
        },
        "timeoutMs": 15000
      }
    },
    {
      "wait": 1000
    },
    {
      "await": {
        "idle": true
      }
    }
  ]
}
